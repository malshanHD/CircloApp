name: Build and deploy Circlo API to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build

      - name: Publish Circlo API
        run: >
          dotnet publish
          ./src/CircloApp.API/CircloApp.API.csproj
          --configuration Release
          --output ./publish

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: circlo-api
          path: ./publish
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: circlo-api
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_671BC9330D58400F9AC7F33D9241B551 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F433E4F7D07A41CEA806B7E62ED9BB3D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BF32B8DF6F2F43E78CC686633630C1A8 }}

      - name: Deploy Circlo API
        uses: azure/webapps-deploy@v3
        with:
          app-name: circlo-api-prod
          slot-name: Production
          package: ./publish
