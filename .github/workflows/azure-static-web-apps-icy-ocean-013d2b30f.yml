name: Deploy Circlo React - New Azure

on:
  push:
    branches:
      - master

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - master

  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.action != 'closed')

    runs-on: ubuntu-latest
    name: Build and Deploy Circlo React

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Install OIDC client
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get GitHub ID token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const core = require('@actions/core');
            return await core.getIDToken();
          result-encoding: string

      - name: Build and deploy React application
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL_NEW_AZURE }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_OCEAN_013D2B30F }}
          action: upload
          app_location: ./frontend
          api_location: ""
          output_location: dist
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'

    runs-on: ubuntu-latest
    name: Close Pull Request Environment

    steps:
      - name: Close pull request environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_OCEAN_013D2B30F }}
          action: close
