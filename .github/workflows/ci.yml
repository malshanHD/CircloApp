name: CircloApp CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  # Job 1: Executes Unit Tests with Merged Coverlet Coverage
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore Packages
        run: dotnet restore

      # 1. Run tests and save raw coverage results into a single directory
      - name: Run Unit Tests with Coverage
        run: dotnet test --no-restore --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

      # 2. Install ReportGenerator tool locally
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      # 3. Merge all coverage.cobertura.xml files into a single merged Cobertura file
      - name: Merge Coverage Reports
        run: reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"TestResults/Merged" -reporttypes:"Cobertura"

      # 4. Generate Markdown summary from the SINGLE merged report
      - name: Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: 'TestResults/Merged/Cobertura.xml'
          badge: true
          format: markdown
          output: file

      # 5. Append summary to GitHub step output
      - name: Add Coverage to Action Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      # 6. Upload merged coverage result artifact
      - name: Upload Coverage Results
        uses: actions/upload-artifact@v4.6.1
        with:
          name: code-coverage-results
          path: 'TestResults/Merged/Cobertura.xml'

  # Job 2: Builds and Publishes the API
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore Packages
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Publish API
        run: dotnet publish src/CircloApp.API/CircloApp.API.csproj -c Release -o publish

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: circloapp-api
          path: publish/