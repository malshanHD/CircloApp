name: CircloApp CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  # Job 1: Executes Unit Tests with Coverlet Coverage
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore Packages
        run: dotnet restore

      - name: Run Unit Tests with Coverage
        run: dotnet test --no-restore --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

      # --- NEW: Generate and display Markdown Summary ---
      - name: Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: 'TestResults/**/coverage.cobertura.xml'
          badge: true
          format: markdown
          output: file

      - name: Add Coverage to Action Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Results
        uses: actions/upload-artifact@v4.6.1
        with:
          name: code-coverage-results
          path: '**/TestResults/**/coverage.cobertura.xml'

  # Job 2: Builds and Publishes the API
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore Packages
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Publish API
        run: dotnet publish src/CircloApp.API/CircloApp.API.csproj -c Release -o publish

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: circloapp-api
          path: publish/